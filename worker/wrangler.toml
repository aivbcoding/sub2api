name = "sub2api-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# ============================================================
# sub2api -> Cloudflare Workers 移植版 (方案 C / MVP 骨架)
# 上游项目: https://github.com/Wei-Shaw/sub2api  (LGPL-3.0)
# ============================================================

# ---- D1: 替代 PostgreSQL 15+ ----
[[d1_databases]]
binding = "DB"
database_name = "sub2api"
database_id = "33738e04-4b5e-44a7-a85a-357fd1f82db6"

# ---- KV: 替代 Redis 的 缓存/最终一致场景 ----
[[kv_namespaces]]
binding = "KV"
id = "7d8d6f01841f4f70a4e1f10e678f7e58"

# ---- Durable Object: 替代 Redis 的 原子计数/粘性会话/并发槽位 ----
[[durable_objects.bindings]]
name = "ACCOUNT_COORDINATOR"
class_name = "AccountCoordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AccountCoordinator"]

[vars]
# 非敏感配置。敏感值请用 `wrangler secret put XXX`
API_KEY_PREFIX = "sk-"
# 允许的 CORS 来源，逗号分隔；* 表示全部
CORS_ALLOWED_ORIGINS = "*"
# 是否强依赖余额（true 时 balance<=0 直接 403 INSUFFICIENT_BALANCE）
ENFORCE_BALANCE = "true"
# 是否强制要求官方安全策略
ALLOW_INSECURE_HTTP = "false"
# GET /v1/models 列表模式:
#   auto     = 聚合各上游模型的真实列表(失败时回退到分组白名单/定价表) —— 默认
#   local    = 完全离线, 只返回分组白名单/定价表里的模型, 不打上游
#   upstream = 透传第一个可用上游的原生响应(不做聚合与统一)
MODELS_LIST_MODE = "auto"

# ---- 邮箱验证码 / Turnstile(可选; 配了才启用验证码注册) ----
# TURNSTILE_SITE_KEY 是**公开**值(嵌前端), 可以放这里:
TURNSTILE_SITE_KEY = "0x4AAAAAAFArM73kUM74AG77"
# 其余凭据走 `wrangler secret put`(绝不能进 toml):
#   TURNSTILE_SECRET_KEY   = <Cloudflare Turnstile Siteverify 密钥>
#   TURNSTILE_HOSTNAMES    = "aixm.ccwu.cc,sub2api.aixm.ccwu.cc"
#   MAIL_WORKER_URL        = https://<mail-worker>/send
#   MAIL_WORKER_SECRET     = 与邮件 Worker 的 SUB2API_WORKER_SECRET 一致
#   VERIFY_CODE_PEPPER     = 验证码 HMAC 用 Pepper(随机长字符串)
#   DEBUG_MAIL             = "1" 时调试模式(不真发信, 验证码回显) —— 生产勿开

[observability]
enabled = true
